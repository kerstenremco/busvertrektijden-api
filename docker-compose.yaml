services:
  db:
    image: postgres:16.11
    restart: unless-stopped
    ports:
      - 5432:5432
    logging:
      driver: loki
      options:
        loki-url: http://localhost:3100/loki/api/v1/push
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env.db
  redis:
    image: redis:7.0.15
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: http://localhost:3100/loki/api/v1/push
  api:
    build: .
    restart: unless-stopped
    ports:
      - 3000:3000
    logging:
      driver: loki
      options:
        loki-url: http://localhost:3100/loki/api/v1/push
    env_file:
      - .env.api
    environment:
      - SERVER_CMD=server
    depends_on:
      - db
      - redis
  worker:
    build: .
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: http://localhost:3100/loki/api/v1/push
    env_file:
      - .env.api
    environment:
      - SERVER_CMD=server:worker
    depends_on:
      - db
      - redis

volumes:
  pgdata:
